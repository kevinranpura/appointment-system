services:
  postgres:
    image: postgres:16
    container_name: appointment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: appointment_user
      POSTGRES_PASSWORD: appointment_password
      POSTGRES_DB: appointment_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: appointment-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: